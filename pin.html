<!doctype html>
<html lang="zh-CN" data-skin="cork">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; media-src 'self' file: blob:; worker-src 'self' file: blob:">
<title>晾晾</title>
<link rel="stylesheet" href="skins.css">
<style>
/* A pinned card: floats above every window. Drag to move, wheel to zoom, double-click or Esc to hang it back. */
:root { --pin-pad:0px; }
:root[data-skin="cork"] { --pin-pad:8px; }
:root[data-skin="blueprint"] { --pin-pad:4px; }
#frame { position:absolute; inset:var(--m, 14px); box-sizing:border-box; display:flex; flex-direction:column; background:var(--surface); border:var(--card-bw) solid var(--card-bc); border-radius:var(--radius); box-shadow:var(--shadow); padding:var(--pin-pad); overflow:hidden; cursor:grab; animation:in .26s cubic-bezier(.2,1.2,.4,1); }
#frame.moving { cursor:grabbing; box-shadow:var(--shadow-lift); }
@keyframes in { from { scale:.9; opacity:0; } }
:root[data-skin="cork"] #frame { overflow:visible; }
:root[data-skin="cork"] #frame::before { content:""; position:absolute; top:-7px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:radial-gradient(circle at 34% 30%, #ff9b8c 0 16%, var(--accent) 46%, #6e140b 100%); box-shadow:0 3px 4px rgba(40,15,0,.45); z-index:5; }
.media { flex:1; min-height:0; position:relative; overflow:hidden; border-radius:max(0px, calc(var(--radius) - var(--card-bw) - var(--pin-pad))); display:grid; place-items:center; }
.media img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
.media video { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
.media.paper { background:var(--paper); }
.media canvas { display:block; }
.pdf-nav { position:absolute; left:50%; bottom:10px; translate:-50% 0; display:flex; align-items:center; gap:2px; padding:3px; border-radius:999px; background:var(--scrim); color:var(--scrim-ink); font:600 12px var(--mono); opacity:0; transition:opacity .15s; z-index:3; }
#frame:hover .pdf-nav { opacity:1; }
.pdf-nav button { width:26px; height:26px; border:0; border-radius:50%; background:transparent; color:inherit; display:grid; place-items:center; cursor:pointer; }
.pdf-nav button:hover { background:rgba(255,255,255,.18); }
.pdf-nav svg.i { width:15px; height:15px; }
.pdf-nav span { padding:0 4px; min-width:44px; text-align:center; }
.head { flex:none; display:flex; align-items:center; gap:8px; height:32px; padding:0 70px 0 12px; border-bottom:1px solid var(--line); font-size:12.5px; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
pre.body { flex:1; min-height:0; margin:0; padding:12px 14px; overflow:auto; font:12.5px/1.6 var(--mono); white-space:pre-wrap; word-break:break-word; color:var(--ink); user-select:text; cursor:text; }
.note { flex:1; min-height:0; overflow:auto; padding:18px 20px; white-space:pre-wrap; word-break:break-word; font-family:var(--font-note); font-size:var(--note-size); line-height:1.6; color:var(--note-ink); user-select:text; }
.card { flex:1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:8px; padding:16px 18px; min-width:0; }
.card .row { display:flex; align-items:center; gap:14px; min-width:0; max-width:100%; }
.card .nm { font-weight:700; font-size:15px; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .sub { font:12px/1.5 var(--mono); color:var(--muted); word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card audio { width:100%; }
.go { border:0; padding:6px 12px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font:600 12.5px var(--font-ui); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.go svg.i { width:14px; height:14px; }
.tools { position:absolute; top:8px; right:8px; display:flex; gap:4px; opacity:0; transition:opacity .15s; z-index:6; }
#frame:hover .tools { opacity:1; }
.tools button { width:26px; height:26px; border-radius:8px; border:0; display:grid; place-items:center; background:var(--scrim); color:var(--scrim-ink); cursor:pointer; padding:0; }
.tools button:hover { background:var(--accent); color:var(--accent-ink); }
.tools svg.i { width:14px; height:14px; }
.miss { color:var(--muted); font-size:13px; padding:20px; text-align:center; }
#toasts { top:46px; }
[hidden] { display:none !important; }
#glare { position:absolute; inset:var(--m, 14px); border-radius:var(--radius); pointer-events:none; z-index:7; opacity:0; transition:opacity .35s; mix-blend-mode:overlay; background:radial-gradient(farthest-corner circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 30%, rgba(0,0,0,.12) 95%); }
body:hover #glare { opacity:1; }
:root[data-skin="mecha"] #frame { border:1.5px solid transparent; background:linear-gradient(var(--surface), var(--surface)) padding-box, conic-gradient(from var(--ang), rgba(0,240,255,.25), #00f0ff 10%, rgba(0,240,255,.25) 22%, rgba(255,43,214,.3) 50%, #ff2bd6 60%, rgba(0,240,255,.25) 72%) border-box; animation:in .26s cubic-bezier(.2,1.2,.4,1), spin 5s linear infinite; }
@property --ang { syntax:"<angle>"; inherits:false; initial-value:0deg; }
@keyframes spin { to { --ang:360deg; } }
:root[data-skin="berry"] #frame { box-shadow:var(--shadow), inset 0 0 0 4px #fff, inset 0 0 0 5.5px #ffd6e6; }
:root[data-skin="cork"] #frame { background:radial-gradient(rgba(120,90,50,.06) 1px, transparent 1.2px) 0 0/4px 4px, linear-gradient(170deg, #fffdf8, #f4eee2); }
:root[data-skin="mecha"] body { filter:drop-shadow(0 0 6px rgba(0,240,255,.45)); }
:root[data-skin="mecha"] #frame { border-radius:0; }
:root[data-skin="berry"] #frame { overflow:visible; }
:root[data-skin="berry"] #frame::before { content:""; position:absolute; top:-9px; left:50%; width:20px; height:17px; margin-left:-10px; background:#ff6fa5; clip-path:path("M10 17 L1.7 8.8 A4.9 4.9 0 0 1 10 2.8 A4.9 4.9 0 0 1 18.3 8.8 Z"); z-index:5; filter:drop-shadow(0 2px 2px rgba(224,100,143,.4)); }
</style>
</head>
<body>
<div id="frame">
  <div class="tools" data-nodrag>
    <button id="copyBtn" title="复制  Ctrl+C"></button>
    <button id="backBtn" title="挂回绳上  Esc / 双击"></button>
  </div>
</div>
<div id="glare"></div>
<div class="toast-box" id="toasts"></div>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf.worker.min.js"></script>
<script src="common.js"></script>
<script src="pin.js"></script>
</body>
</html>
